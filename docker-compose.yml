version: '3.8'

services:
  php:
    image: php:8.2-apache
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eleitor_php
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./www:/var/www/html
      - .:/var/www/html
    environment:
      - APP_ENV=development
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=eleitor_consciente
      - DB_USERNAME=eleitor_user
      - DB_PASSWORD=eleitor_pass
      - DB_ROOT_PASSWORD=root
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: eleitor_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: eleitor_consciente
      MYSQL_USER: eleitor_user
      MYSQL_PASSWORD: eleitor_pass
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: