# =============================================================================
# Eleitor Consciente 2026 - Nginx Configuration
# =============================================================================

server {
    listen 80;
    server_name eleitor-consciente.local www.eleitor-consciente.local;

    root /var/www/html/public;
    index index.php index.html;

    # Tamanho máximo de upload
    client_max_body_size 12M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logs
    access_log /var/log/nginx/eleitor-access.log;
    error_log /var/log/nginx/eleitor-error.log;

    # Cache de assets estáticos
    location ~* \.(jpg|jpeg|gif|png|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Bloquear acesso a diretórios sensíveis
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(database|storage|vendor|node_modules)/ {
        deny all;
    }

    # Rotas da aplicação PHP
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Processamento PHP
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Symlinks de fotos
    location /fotos {
        alias /var/www/html/database/foto_cand2026_SP_div;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /fotos_br {
        alias /var/www/html/database/foto_cand2026_BR_div;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
}
