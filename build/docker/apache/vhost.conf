<VirtualHost *:80>
    ServerName eleitor-consciente.local
    ServerAlias www.eleitor-consciente.local
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Headers de segurança
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data:"
    </IfModule>

    # Cache de assets estáticos
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/jpg "access plus 1 month"
        ExpiresByType image/jpeg "access plus 1 month"
        ExpiresByType image/gif "access plus 1 month"
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType image/svg+xml "access plus 1 month"
        ExpiresByType text/css "access plus 1 week"
        ExpiresByType application/javascript "access plus 1 week"
        ExpiresByType text/html "access plus 0 seconds"
    </IfModule>

    # Compressão
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css
        AddOutputFilterByType DEFLATE application/javascript application/json
        AddOutputFilterByType DEFLATE image/svg+xml
    </IfModule>

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/eleitor-error.log
    CustomLog ${APACHE_LOG_DIR}/eleitor-access.log combined

    # Bloquear acesso a diretórios sensíveis
    <DirectoryMatch "^/.*/\.">
        Require all denied
    </DirectoryMatch>

    # Bloquear acesso à pasta database
    <Directory /var/www/html/database>
        Require all denied
    </Directory>
</VirtualHost>
